name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hits
          POSTGRES_PASSWORD: hits
          POSTGRES_DB: hits_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hits -d hits_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      CHECKPOINT_DISABLE: "1"
      DO_NOT_TRACK: "1"
      DATABASE_URL: postgresql://hits:hits@localhost:5432/hits_os?schema=public
      DIRECT_URL: postgresql://hits:hits@localhost:5432/hits_os?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-01234567890123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-01234567890123456789

    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm la toma de package.json "packageManager" (no duplicar aquí).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # El cliente Prisma debe existir antes de lint/typecheck/build (aporta los
      # tipos MovementType, delegates, etc.). Turbo no lo garantiza por sí solo.
      - name: Generate Prisma client
        run: pnpm --filter @24hits/database db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm --filter @24hits/database db:deploy

      # El POSTGRES_USER del contenedor es superusuario y los superusuarios SALTAN RLS.
      # Creamos un rol no-superusuario para que las pruebas de aislamiento sean válidas.
      - name: Create non-superuser app role (RLS enforcement)
        env:
          PGPASSWORD: hits
        run: |
          which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql -h localhost -U hits -d hits_os -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='hits_app') THEN
              CREATE ROLE hits_app LOGIN PASSWORD 'hits_app' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END $$;
          GRANT USAGE ON SCHEMA public TO hits_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO hits_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO hits_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO hits_app;
          SQL

      - name: Integration tests (RLS / tenant isolation / concurrency / purchasing)
        env:
          DATABASE_URL: postgresql://hits_app:hits_app@localhost:5432/hits_os?schema=public
          DIRECT_URL: postgresql://hits_app:hits_app@localhost:5432/hits_os?schema=public
        run: pnpm --filter @24hits/api test:integration
