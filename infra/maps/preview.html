<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview — 24 HITS mapa self-hosted</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
  <style>
    html, body, #map { margin: 0; height: 100%; background: #0b1020; }
    #hud { position: absolute; top: 10px; left: 10px; z-index: 2; background: rgba(0,0,0,.6);
      color: #fff; font: 12px system-ui; padding: 6px 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hud">Preview de tu estilo · arrastra/zoom para explorar</div>
  <script>
    const hud = document.getElementById("hud");
    const S = "http://localhost:8080";
    // Registra el protocolo pmtiles y AÑADE explícitamente los dos archivos
    // (calles + edificios). Sin esto, con 2 pmtiles a veces falla uno.
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);
    protocol.add(new pmtiles.PMTiles(S + "/data/chihuahua.pmtiles"));
    protocol.add(new pmtiles.PMTiles(S + "/data/buildings.pmtiles"));

    const map = new maplibregl.Map({
      container: "map",
      style: "./style.local.json",
      center: [-106.0889, 28.6353],
      zoom: 16, pitch: 45, maxPitch: 70, bearing: 0,
      antialias: false, maxTileCacheSize: 256,
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

    let lastErr = "";
    map.on("error", (e) => { lastErr = (e && e.error && e.error.message) || String(e); });

    map.on("load", () => {
      try {
        map.addSource("bld", { type: "vector", url: "pmtiles://" + S + "/data/buildings.pmtiles" });
        map.addLayer({
          id: "3d-buildings", source: "bld", "source-layer": "building",
          type: "fill-extrusion", minzoom: 14,
          paint: {
            "fill-extrusion-color": ["interpolate", ["linear"], ["coalesce", ["get","h"], 6],
              0, "#232838", 8, "#2b3247", 16, "#38415a", 30, "#4a557a"],
            "fill-extrusion-height": ["interpolate", ["linear"], ["zoom"], 14, 0, 16, ["coalesce", ["get","h"], 6]],
            "fill-extrusion-base": 0, "fill-extrusion-opacity": 0.92, "fill-extrusion-vertical-gradient": true,
          }
        }, "road-minor");
      } catch (e) { lastErr = "buildings: " + e.message; }
    });

    // DIAGNÓSTICO: cuenta lo que realmente se está dibujando y lo muestra.
    map.on("idle", () => {
      let roads = 0, blds = 0;
      try { roads = map.queryRenderedFeatures({ layers: ["road-minor","road-secondary","road-primary","road-major"] }).length; } catch (e) {}
      try { blds = map.queryRenderedFeatures({ layers: ["3d-buildings"] }).length; } catch (e) {}
      hud.innerHTML = `calles dibujadas: <b>${roads}</b> · edificios: <b>${blds}</b>` + (lastErr ? `<br><span style="color:#fca5a5">${lastErr}</span>` : "");
    });
  </script>
</body>
</html>
