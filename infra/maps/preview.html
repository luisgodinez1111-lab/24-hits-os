<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview — 24 HITS mapa self-hosted</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
  <style>
    html, body, #map { margin: 0; height: 100%; background: #0b1020; }
    #hud { position: absolute; top: 10px; left: 10px; z-index: 2; background: rgba(0,0,0,.6);
      color: #fff; font: 12px system-ui; padding: 6px 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hud">Preview de tu estilo · arrastra/zoom para explorar</div>
  <script>
    // Registra el protocolo pmtiles:// para leer tu archivo local.
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const map = new maplibregl.Map({
      container: "map",
      style: "./style.local.json",     // estilo apuntando al pmtiles LOCAL
      center: [-106.0889, 28.6353],    // Chihuahua centro
      zoom: 16,
      pitch: 45,                        // inclinación menor = mucho más ligero
      maxPitch: 70,
      bearing: 0,
      antialias: false,                 // antialias satura la GPU integrada
      maxTileCacheSize: 256,
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

    // Edificios 3D desde TU pmtiles de edificios (Microsoft, 160k en Chihuahua).
    map.on("load", () => {
      try {
        // Inserta los edificios ANTES de las calles → las calles quedan encima
        // y siempre se ven (si no, los edificios las tapan).
        map.addSource("bld", { type: "vector", url: "pmtiles://http://localhost:8080/data/buildings.pmtiles" });
        map.addLayer({
          id: "3d-buildings", source: "bld", "source-layer": "building",
          type: "fill-extrusion", minzoom: 14,
          paint: {
            "fill-extrusion-color": ["interpolate", ["linear"], ["coalesce", ["get","h"], 6],
              0, "#232838", 8, "#2b3247", 16, "#38415a", 30, "#4a557a"],
            "fill-extrusion-height": ["interpolate", ["linear"], ["zoom"], 14, 0, 16, ["coalesce", ["get","h"], 6]],
            "fill-extrusion-base": 0,
            "fill-extrusion-opacity": 0.92,
            "fill-extrusion-vertical-gradient": true,
          }
        }, "road-minor");   // beforeId = primera capa de calles → calles encima
      } catch (e) { console.warn("buildings:", e); }
    });

    map.on("error", (e) => {
      document.getElementById("hud").textContent = "Error: " + (e && e.error && e.error.message || e);
    });
  </script>
</body>
</html>
