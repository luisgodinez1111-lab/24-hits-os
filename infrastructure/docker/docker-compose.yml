# Infraestructura local de 24 HITS OS.
# Levantar: docker compose -f infrastructure/docker/docker-compose.yml up -d
# (o el atajo: pnpm infra:up)
name: hits-os

services:
  postgres:
    image: postgres:16-alpine
    container_name: hits-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hits
      POSTGRES_PASSWORD: hits
      POSTGRES_DB: hits_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hits -d hits_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hits-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: hits-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Consola web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crea el bucket privado al arrancar (idempotente).
  minio-init:
    image: minio/mc:latest
    container_name: hits-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/hits-private &&
      mc anonymous set none local/hits-private &&
      echo 'Bucket hits-private listo (privado).'
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
