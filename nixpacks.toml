# Railway / Nixpacks — servicio WORKER (BullMQ). Proceso persistente, sin puerto HTTP.
# Se instala con devDependencies (--prod=false) porque el build necesita tsc/prisma;
# en runtime corre el dist compilado.

[phases.install]
cmds = ["pnpm install --prod=false"]

[phases.build]
cmds = [
  "pnpm --filter @24hits/database db:generate",
  "pnpm turbo run build --filter=@24hits/worker",
]

[start]
cmd = "node apps/worker/dist/main.js"
